{% extends 'marks/base.html' %}

{% block title %}Password Reset Complete - ResTrack{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto px-3 sm:px-0 py-10 sm:py-14 animate-fade-in-up">
    <div class="glass-effect rounded-2xl border border-gray-200 shadow-xl overflow-hidden">
        <div class="h-1.5 bg-gradient-to-r from-purple-600 via-blue-500 to-cyan-500"></div>
        <div class="p-5 sm:p-7">
            <div class="text-center">
                <div class="mx-auto w-12 h-12 rounded-2xl bg-emerald-100 text-emerald-700 flex items-center justify-center mb-4">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-gray-900">Password Reset Complete</h1>
                <p class="text-sm text-gray-600 mt-3">Your password has been updated successfully.</p>
                <p class="text-sm text-gray-600 mt-2">You can now sign in using your new password.</p>
            </div>

            <div class="mt-6 text-center">
                <a href="{% url 'login' %}" class="inline-flex items-center justify-center px-5 py-2.5 rounded-xl bg-gradient-to-r from-purple-600 to-blue-600 text-white text-sm font-semibold shadow-md hover:shadow-lg transition-all">Go to Login</a>
            </div>

            <div class="mt-5 text-center border-t border-gray-100 pt-4">
                <a href="{% url 'home' %}" class="text-sm text-gray-600 hover:text-gray-900 inline-flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    Back to home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
