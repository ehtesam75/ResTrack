{% extends 'marks/base.html' %}

{% block title %}Forgot Password - ResTrack{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-2 sm:px-0">
    <div class="glass-effect rounded-xl border border-gray-200 shadow-lg p-4 sm:p-6" style="margin-top: 4rem;">
        <div class="mb-5 text-center">
            <h1 class="text-xl sm:text-2xl font-bold gradient-text">Forgot Password</h1>
            <p class="text-xs sm:text-sm text-gray-600 mt-1">Enter your account email to receive a secure reset link.</p>
        </div>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="id_email" class="block text-xs font-semibold text-gray-700 mb-1">Email Address</label>
                <input
                    type="email"
                    name="email"
                    id="id_email"
                    required
                    value="{{ form.email.value|default_if_none:'' }}"
                    class="w-full px-2.5 sm:px-3 py-1.5 sm:py-2 text-xs sm:text-sm border {% if form.email.errors %}border-red-400{% else %}border-gray-300{% endif %} rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent bg-gray-50 hover:bg-white transition-colors"
                    placeholder="you@example.com"
                >
                {% for error in form.email.errors %}
                <p class="text-red-500 text-xs mt-1">{{ error }}</p>
                {% endfor %}
            </div>

            <div class="pt-2">
                <button type="submit" class="w-full bg-purple-100 text-purple-700 font-medium py-2 sm:py-2.5 rounded-lg text-xs sm:text-sm shadow-sm hover:shadow-md hover:bg-purple-200 transition-all">
                    Send Reset Link
                </button>
            </div>
        </form>

        <div class="mt-5 text-center">
            <a href="{% url 'login' %}" class="text-xs sm:text-sm text-gray-600 hover:text-gray-800">Back to login</a>
        </div>
    </div>
</div>
{% endblock %}
