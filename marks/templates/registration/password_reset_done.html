{% extends 'marks/base.html' %}

{% block title %}Check Your Email - ResTrack{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-2 sm:px-0">
    <div class="glass-effect rounded-xl border border-gray-200 shadow-lg p-4 sm:p-6" style="margin-top: 4rem;">
        <div class="text-center">
            <h1 class="text-xl sm:text-2xl font-bold gradient-text">Check Your Email</h1>
            <p class="text-xs sm:text-sm text-gray-600 mt-3">
                If the email is registered, a password reset link has been sent.
            </p>
            <p class="text-xs sm:text-sm text-gray-600 mt-2">
                Please open your inbox and follow the link to set a new password.
            </p>
        </div>

        <div class="mt-6 text-center">
            <a href="{% url 'login' %}" class="text-xs sm:text-sm text-purple-600 font-semibold hover:text-purple-700">Return to login</a>
        </div>
    </div>
</div>
{% endblock %}
