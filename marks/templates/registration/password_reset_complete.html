{% extends 'marks/base.html' %}

{% block title %}Password Reset Complete - ResTrack{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-2 sm:px-0">
    <div class="glass-effect rounded-xl border border-gray-200 shadow-lg p-4 sm:p-6" style="margin-top: 4rem;">
        <div class="text-center">
            <h1 class="text-xl sm:text-2xl font-bold gradient-text">Password Updated</h1>
            <p class="text-xs sm:text-sm text-gray-600 mt-3">Your password has been reset successfully.</p>
            <p class="text-xs sm:text-sm text-gray-600 mt-2">You can now sign in with your new password.</p>
        </div>

        <div class="mt-6 text-center">
            <a href="{% url 'login' %}" class="text-xs sm:text-sm text-purple-600 font-semibold hover:text-purple-700">Log in now</a>
        </div>
    </div>
</div>
{% endblock %}
